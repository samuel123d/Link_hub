            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Cartões Slim com Alto Contraste e Toque Confortável */
        .slim-card {
            position: relative;
            min-height: 60px;
            background: rgba(24, 24, 27, 0.78);
            border: 1px solid #27272a;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                        background-color 0.2s ease,
                        border-color 0.2s ease,
                        box-shadow 0.2s ease;
        }

        @media (min-width: 640px) {
            .slim-card {
                min-height: 66px;
            }
        }

        .slim-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                240px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(var(--accent-rgb), 0.10),
                transparent 75%
            );
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .slim-card:hover::before {
            opacity: 1;
        }

        .slim-card:hover {
            background: rgba(30, 30, 35, 0.92);
            border-color: rgba(var(--accent-rgb), 0.45);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.6);
        }

        .slim-card:active {
            transform: scale(0.99);
            background: rgba(39, 39, 42, 0.9);
        }

        .slim-card:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.35);
        }

        /* Entrada suave */
        .fade-in {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            width: 6px;

            background: #27272a;
            border-radius: 99px;
        }

        const linksContainer = document.getElementById('linksContainer');
        const GLYPHS = 'abcdefghijklmnopqrstuvwxyz0123456789/_-';

        function subtleDecode(el, targetText) {
            if (!el || !targetText) return;
            clearInterval(el._decodeTimer);
            let step = 0;

            el._decodeTimer = setInterval(() => {
                el.textContent = targetText
                    .split('')
                    .map((char, idx) => {
                        if (char === ' ') return ' ';
                        if (idx < step) return targetText[idx];
                        return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
                    })
                    .join('');

                if (step >= targetText.length) {
                    clearInterval(el._decodeTimer);
                    el.textContent = targetText;
                }
                step += 0.7;
            }, 18);
        }

                            ${index + 1}
                        </span>
                        <svg class="w-4 h-4 sm:w-[18px] sm:h-[18px] text-zinc-500 group-hover:text-emerald-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"
                             fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M17 7H8M17 7V16"/>
                        </svg>
                    </div>
                `;

                const titleEl = anchor.querySelector('.link-title');

                anchor.addEventListener('mouseenter', () => {
                    subtleDecode(titleEl, item.title);
                });

                anchor.addEventListener('mousemove', (e) => {
                    const rect = anchor.getBoundingClientRect();
                    anchor.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                    anchor.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
                });

                linksContainer.appendChild(anchor);
            });
        }

        // =========================================================================
        // 3. COPIAR PARA ÁREA DE TRANSFERÊNCIA & TOAST
        // =========================================================================
        const toastEl = document.getElementById('toast');
        const toastMsgEl = document.getElementById('toastMessage');
        let toastTimer = null;

        function showToast(message) {
            toastMsgEl.textContent = message;
            toastEl.classList.remove('opacity-0', 'translate-y-2');
            toastEl.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('opacity-100', 'translate-y-0');
                toastEl.classList.add('opacity-0', 'translate-y-2');
            }, 2200);
        }

        async function copyText(text, successLabel) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const temp = document.createElement('textarea');
                    temp.value = text;
                    temp.style.position = 'fixed';
                    temp.style.opacity = '0';
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                }
                showToast(successLabel);
            } catch {
                showToast('Não foi possível copiar');
            }
        }

        document.getElementById('shareBtn').addEventListener('click', () => {
            copyText(window.location.href, 'Link da página copiado');
        });

        document.getElementById('copyHandleBtn').addEventListener('click', () => {
            copyText(PROFILE.handle, 'Usuário @samuelanderson copiado');
        });

        document.getElementById('copyEmailBtn').addEventListener('click', () => {
            copyText(PROFILE.email, 'E-mail copiado');
        });

        // Atalhos de teclado [1-4] para abrir links no computador
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const num = parseInt(e.key, 10);
            if (num >= 1 && num <= PROFILE.links.length) {
                const target = PROFILE.links[num - 1];
                if (target?.url) {
                    window.open(target.url, '_blank', 'noopener,noreferrer');
                }
            }
        });

        // =========================================================================
        // 4. CANVAS 2D RESPONSIVO (DOT-GRID + CONEXÕES SUTIS)
        // =========================================================================
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let width = 0;
        let height = 0;
        const mouse = { x: -9999, y: -9999 };
        let dots = [];

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initDots();
        }

        function initDots() {
            const count = Math.min(26, Math.max(12, Math.floor((width * height) / 52000)));
            dots = [];
            for (let i = 0; i < count; i++) {
                dots.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function renderCanvas() {
            const rgb = '52, 211, 153';
            ctx.clearRect(0, 0, width, height);

            const spacing = 30;
            const hoverRadius = 170;

            for (let gx = spacing / 2; gx < width; gx += spacing) {
                for (let gy = spacing / 2; gy < height; gy += spacing) {
                    const dist = Math.hypot(gx - mouse.x, gy - mouse.y);
                    if (dist < hoverRadius) {
                        const boost = (1 - dist / hoverRadius) * 0.2;
                        ctx.fillStyle = `rgba(${rgb}, ${0.05 + boost})`;
                    } else {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
                    }
                    ctx.fillRect(gx, gy, 1.2, 1.2);
                }
            }

            const linkDist = 140;
            for (let i = 0; i < dots.length; i++) {
                const a = dots[i];
                if (!prefersReducedMotion) {
                    a.x += a.vx;
                    a.y += a.vy;
                    if (a.x < 0 || a.x > width) a.vx *= -1;
                    if (a.y < 0 || a.y > height) a.vy *= -1;
                }

                ctx.fillStyle = `rgba(${rgb}, 0.2)`;
                ctx.beginPath();
                ctx.arc(a.x, a.y, 1.3, 0, Math.PI * 2);
                ctx.fill();

                const dMouse = Math.hypot(a.x - mouse.x, a.y - mouse.y);
                if (dMouse < 150) {
                    ctx.strokeStyle = `rgba(${rgb}, ${(1 - dMouse / 150) * 0.15})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }

                for (let j = i + 1; j < dots.length; j++) {
                    const b = dots[j];
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (d < linkDist) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${(1 - d / linkDist) * 0.04})`;
                        ctx.lineWidth = 0.75;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.stroke();
                    }
                }
            }

            if (!prefersReducedMotion) {
                requestAnimationFrame(renderCanvas);
            }
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }, { passive: true });
        window.addEventListener('mouseleave', () => {
            mouse.x = -9999;
            mouse.y = -9999;
        });

        // Inicialização
        renderLinks();
        resizeCanvas();
        renderCanvas();
    </script>
</body>
</html>
